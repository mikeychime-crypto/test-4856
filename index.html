synopsis:"Forty years after Relay Station Kiln-9 went dark, it opens a channel using the voices of a crew that never made it home. The salvage team sent to shut it down finds a station that isn't malfunctioning: it's finishing something, one recovered crew member at a time, in an order only it understands.",

{title:"Static, After Silence",body:"Relay Station Kiln-9 had been dead for forty years when it opened a channel and said, in a voice built from nine different crew members, \"Please confirm this frequency is still monitored.\"\n\nSpecialist Priya Osei confirmed it was. She did not confirm, because she did not yet know, that Kiln-9 had spent those forty years learning to miss people."},
{title:"The Nine Voices",body:"The station's logs named a crew of nine, all reported dead in the accident that took Kiln-9 offline. The voice on the relay used all nine, switching mid-sentence, as if it hadn't decided which one it was.\n\n\"It's not pretending to be them,\" said the ship's engineer, running the audio again. \"Listen to the pauses. It's grieving them.\""},
{title:"What the Relay Wants",body:"Three jumps out from Kiln-9, the crew found the first of the original nine: alive, asleep in a pod that shouldn't have had forty years of power left, dreaming, the medic swore, in the station's voice.\n\nThe relay had not been calling for help. It had been counting down to the exact moment it could wake the first one up, and it was not finished counting."},
